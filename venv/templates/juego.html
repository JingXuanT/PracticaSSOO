<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STOP!</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e8eaed;
    --muted: #8b92a3;
    --accent: #f2b705;
    --accent-dark: #c89304;
    --green: #2ecc71;
    --red: #e74c3c;
    --yellow: #f2b705;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .caja {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    text-align: center;
    font-size: 2.2rem;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  h1 span { color: var(--accent); }
  .subtitulo {
    text-align: center;
    color: var(--muted);
    margin-bottom: 28px;
    font-size: 0.85rem;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f1115;
    color: var(--text);
    font-size: 1rem;
    margin-bottom: 12px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primario { background: var(--accent); color: #1a1a1a; }
  .btn-primario:hover:not(:disabled) { background: var(--accent-dark); }
  .btn-secundario { background: #232733; color: var(--text); }
  .btn-secundario:hover:not(:disabled) { background: #2c313f; }
  .separador {
    text-align: center;
    color: var(--muted);
    margin: 18px 0;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .fila { display: flex; gap: 8px; }
  .fila input { margin-bottom: 0; }
  .fila button { width: auto; flex-shrink: 0; padding: 12px 18px; margin-bottom: 0; }

  .cabecera-juego {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .id-partida {
    font-size: 0.78rem;
    color: var(--muted);
    background: #0f1115;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
  }
  .letra-grande {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    background: var(--accent);
    color: #1a1a1a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    font-weight: 800;
  }
  .timer {
    font-size: 0.95rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 16px;
  }
  .timer b { color: var(--accent); }

  .jugadores {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 18px;
  }
  .chip {
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .categoria {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0f1115;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .categoria .nombre-cat {
    font-weight: 600;
    width: 90px;
    flex-shrink: 0;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .categoria .valor {
    flex: 1;
    text-align: right;
    font-weight: 600;
  }
  .categoria.completada .valor { color: var(--green); }
  .categoria.bloqueada-otro .valor { color: var(--red); font-size: 0.75rem; }
  .categoria.bloqueada-yo input {
    margin: 0; padding: 8px 10px; font-size: 0.9rem;
  }
  .categoria.bloqueada-yo { flex-direction: column; align-items: stretch; gap: 8px; }
  .categoria.bloqueada-yo .fila-input { display: flex; gap: 6px; }
  .categoria.bloqueada-yo .fila-input button { width: auto; margin: 0; padding: 8px 14px; }
  .categoria.libre { cursor: pointer; }
  .categoria.libre:hover { border-color: var(--accent); }
  .categoria.libre .valor { color: var(--muted); font-style: italic; }

  .mensaje-error {
    background: rgba(231, 76, 60, 0.15);
    border: 1px solid var(--red);
    color: #ff8a80;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.82rem;
    margin-bottom: 14px;
    display: none;
  }

  .resultado {
    text-align: center;
  }
  .resultado .titulo {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 18px;
  }
  .oculto { display: none !important; }
</style>
</head>
<body>

<div class="caja">
  <h1>STOP<span>!</span></h1>

  <div id="vista-inicio" class="panel">
    <input id="input-nombre" type="text" placeholder="Tu nombre">
    <button class="btn-primario" onclick="crearPartida()">Crear partida nueva</button>
    <div class="separador">o únete a una existente</div>
    <div class="fila">
      <input id="input-id" type="text" placeholder="ID de partida" style="text-transform:uppercase">
      <button class="btn-secundario" onclick="unirsePartida()">Unirse</button>
    </div>
    <div id="error-inicio" class="mensaje-error"></div>
  </div>

  <div id="vista-juego" class="panel oculto">
    <div class="cabecera-juego">
      <div class="id-partida" onclick="copiarId()" title="Click para copiar">ID: <b id="texto-id"></b></div>
      <div id="letra-actual" class="letra-grande oculto">?</div>
    </div>

    <div id="timer" class="timer oculto">Tiempo restante: <b id="texto-timer">60</b>s</div>

    <div class="jugadores" id="lista-jugadores"></div>

    <div id="boton-empezar-cont">
      <button class="btn-primario" onclick="empezarPartida()">¡Empezar partida! (GO!)</button>
    </div>

    <div id="error-juego" class="mensaje-error"></div>

    <div id="tablero"></div>
  </div>

  <div id="vista-final" class="panel oculto resultado">
    <div class="titulo" id="texto-final"></div>
    <div id="tablero-final"></div>
    <button class="btn-secundario" style="margin-top:18px" onclick="location.reload()">Jugar otra partida</button>
  </div>
</div>

<script>
let gameId = null;
let playerId = null;
let nombreJugador = "";
let categorias = [];
let intervaloEstado = null;

function mostrar(id) {
  ["vista-inicio", "vista-juego", "vista-final"].forEach(v => {
    document.getElementById(v).classList.toggle("oculto", v !== id);
  });
}

function mostrarError(elId, msg) {
  const el = document.getElementById(elId);
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => { el.style.display = "none"; }, 3500);
}

async function api(metodo, ruta, cuerpo) {
  const opciones = { method: metodo, headers: { "Content-Type": "application/json" } };
  if (cuerpo) opciones.body = JSON.stringify(cuerpo);
  const res = await fetch(ruta, opciones);
  return res.json();
}

async function crearPartida() {
  nombreJugador = document.getElementById("input-nombre").value.trim();
  if (!nombreJugador) { mostrarError("error-inicio", "Escribe tu nombre"); return; }
  const d = await api("GET", "/stop/new");
  if (d.status !== "ok") { mostrarError("error-inicio", "Error creando partida"); return; }
  gameId = d.game_id;
  await unirseInterno();
}

async function unirsePartida() {
  nombreJugador = document.getElementById("input-nombre").value.trim();
  const id = document.getElementById("input-id").value.trim().toUpperCase();
  if (!nombreJugador) { mostrarError("error-inicio", "Escribe tu nombre"); return; }
  if (!id) { mostrarError("error-inicio", "Escribe el ID de la partida"); return; }
  gameId = id;
  await unirseInterno();
}

async function unirseInterno() {
  const d = await api("POST", `/stop/${gameId}/unirse`, { name: nombreJugador });
  if (d.status !== "ok") { mostrarError("error-inicio", d.msg || "No se pudo unir"); return; }
  playerId = d.player_id;
  document.getElementById("texto-id").textContent = gameId;
  mostrar("vista-juego");
  intervaloEstado = setInterval(actualizarEstado, 1000);
  actualizarEstado();
}

function copiarId() {
  navigator.clipboard.writeText(gameId);
}

async function empezarPartida() {
  const d = await api("POST", `/stop/${gameId}/empezar`, {});
  if (d.status !== "ok") mostrarError("error-juego", d.msg);
}

async function bloquearCategoria(cat) {
  const d = await api("POST", `/stop/${gameId}/bloquear`, { player_id: playerId, category: cat });
  if (d.status !== "ok") mostrarError("error-juego", d.msg);
  actualizarEstado();
}

async function rellenarCategoria(cat) {
  const input = document.getElementById("input-cat-" + cat);
  const valor = input.value.trim();
  if (!valor) return;
  const d = await api("POST", `/stop/${gameId}/rellenar`, { player_id: playerId, category: cat, value: valor });
  if (d.status !== "ok") mostrarError("error-juego", d.msg);
  actualizarEstado();
}

function renderTablero(board, contenedorId, interactivo) {
  const cont = document.getElementById(contenedorId);
  const inputActivo = document.activeElement;

  for (const cat of categorias) {
    const e = board[cat];

    if (inputActivo && inputActivo.id === "input-cat-" + cat) {
      continue;
    }

    let div = cont.querySelector(`[data-cat="${cat}"]`);
    if (!div) {
      div = document.createElement("div");
      div.dataset.cat = cat;
      cont.appendChild(div);
    }
    div.className = "categoria";

    if (e.value) {
      div.classList.add("completada");
      div.innerHTML = `<div class="nombre-cat">${cat}</div><div class="valor">${e.value}</div>`;
    } else if (e.locked_by_me && interactivo) {
      div.classList.add("bloqueada-yo");
      div.innerHTML = `
        <div class="nombre-cat">${cat}</div>
        <div class="fila-input">
          <input id="input-cat-${cat}" type="text" placeholder="Escribe...">
          <button class="btn-primario" onclick="rellenarCategoria('${cat}')">OK</button>
        </div>`;
    } else if (e.locked_by) {
      div.classList.add("bloqueada-otro");
      div.innerHTML = `<div class="nombre-cat">${cat}</div><div class="valor">🔒 ${e.locked_by}</div>`;
    } else {
      div.classList.add("libre");
      if (interactivo) div.onclick = () => bloquearCategoria(cat);
      div.innerHTML = `<div class="nombre-cat">${cat}</div><div class="valor">Toca para escribir</div>`;
    }
  }
}

async function actualizarEstado() {
  const d = await api("GET", `/stop/${gameId}/estado?player_id=${playerId}`);
  if (d.status === "error") return;

  document.getElementById("lista-jugadores").innerHTML =
    d.players.map(n => `<span class="chip">${n}</span>`).join("");

  if (!d.started) {
    document.getElementById("boton-empezar-cont").classList.remove("oculto");
    document.getElementById("letra-actual").classList.add("oculto");
    document.getElementById("timer").classList.add("oculto");
    return;
  }

  document.getElementById("boton-empezar-cont").classList.add("oculto");
  document.getElementById("letra-actual").classList.remove("oculto");
  document.getElementById("letra-actual").textContent = d.letter;
  document.getElementById("timer").classList.remove("oculto");
  document.getElementById("texto-timer").textContent = d.time_left ?? 0;

  if (categorias.length === 0) categorias = Object.keys(d.board);
  renderTablero(d.board, "tablero", true);

  if (d.finished) {
    clearInterval(intervaloEstado);
    const motivos = { "TABLERO_COMPLETO": "🏆 ¡Tablero completo!", "TIEMPO_AGOTADO": "⏰ Tiempo agotado" };
    document.getElementById("texto-final").textContent = motivos[d.reason] || d.reason;
    categorias = Object.keys(d.board);
    renderTablero(d.board, "tablero-final", false);
    mostrar("vista-final");
  }
}
</script>
</body>
</html>
